<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>FlowTrack</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
        }

        body {
            min-height: 100vh;
            background: #0a0a0a;
            font-family: 'Poppins', 'Segoe UI', system-ui, -apple-system, sans-serif;
            padding: 24px;
            color: #ededed;
            display: flex;
            flex-direction: column;
            position: relative;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
        }

        body::before {
            content: "";
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: 
                linear-gradient(rgba(255, 255, 255, 0.05) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.05) 1px, transparent 1px);
            background-size: 40px 40px;
            pointer-events: none;
            z-index: 0;
            will-change: auto;
        }

        body::after {
            content: "";
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: 
                radial-gradient(1px 1px at 10% 20%, rgba(255,255,255,0.4), transparent),
                radial-gradient(1px 1px at 25% 55%, rgba(255,255,255,0.3), transparent),
                radial-gradient(1.5px 1.5px at 40% 10%, rgba(255,255,255,0.5), transparent),
                radial-gradient(1px 1px at 55% 70%, rgba(255,255,255,0.35), transparent),
                radial-gradient(1.5px 1.5px at 70% 30%, rgba(255,255,255,0.45), transparent),
                radial-gradient(1px 1px at 85% 60%, rgba(255,255,255,0.3), transparent),
                radial-gradient(1px 1px at 15% 80%, rgba(255,255,255,0.4), transparent),
                radial-gradient(1.5px 1.5px at 60% 90%, rgba(255,255,255,0.35), transparent),
                radial-gradient(1px 1px at 90% 15%, rgba(255,255,255,0.3), transparent),
                radial-gradient(1px 1px at 35% 40%, rgba(255,255,255,0.25), transparent),
                radial-gradient(1px 1px at 75% 50%, rgba(255,255,255,0.4), transparent);
            background-size: 200px 200px;
            pointer-events: none;
            z-index: 0;
            will-change: auto;
        }

        .glass-panel {
            max-width: 1100px;
            margin: 0 auto;
            background: transparent;
            border-radius: 56px;
            border: none;
            padding: 40px 32px;
            flex: 1;
            display: flex;
            flex-direction: column;
            position: relative;
            z-index: 1;
        }

        .title {
            text-align: center;
            margin-bottom: 40px;
        }

        .glow-text {
            font-size: clamp(42px, 9vw, 90px);
            font-weight: 700;
            letter-spacing: -0.02em;
            background: linear-gradient(135deg, #a0a0a0 0%, #d0d0d0 40%, #f0f0f0 70%, #b0b0b0 100%);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
            display: inline-block;
            font-family: 'Poppins', 'Segoe UI', sans-serif;
            text-shadow: 0 0 20px rgba(200, 200, 200, 0.3);
            will-change: auto;
        }

        .tabs {
            display: flex;
            justify-content: center;
            gap: 16px;
            margin-bottom: 40px;
            flex-wrap: wrap;
        }

        .tab {
            background: rgba(30, 30, 30, 0.8);
            border: 1.5px solid rgba(180, 180, 180, 0.3);
            color: #b0b0b0;
            font-size: 1rem;
            font-weight: 500;
            padding: 10px 30px;
            border-radius: 60px;
            cursor: pointer;
            transition: transform 0.2s, border-color 0.2s, background 0.2s, box-shadow 0.2s;
            letter-spacing: 1px;
            font-family: 'Poppins', sans-serif;
            position: relative;
            overflow: hidden;
            will-change: transform;
        }

        .tab:active {
            transform: scale(0.96);
        }

        .tab.active {
            border-color: #c0c0c0;
            background: rgba(180, 180, 180, 0.2);
            color: #ffffff;
            box-shadow: 0 0 20px rgba(200, 200, 200, 0.2);
        }

        .tab:hover {
            border-color: rgba(200, 200, 200, 0.6);
            background: rgba(180, 180, 180, 0.15);
        }

        .content-pane {
            display: none;
            flex: 1;
        }

        .content-pane.active {
            display: flex;
            flex-direction: column;
            flex: 1;
            animation: fadeIn 0.2s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(160px, 180px));
            gap: 16px;
            flex: 1;
            justify-content: center;
        }

        .file-card {
            background: rgba(20, 20, 20, 0.8);
            border-radius: 16px;
            padding: 16px 14px;
            text-align: center;
            border: 1.5px solid rgba(180, 180, 180, 0.2);
            position: relative;
            overflow: hidden;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            width: 100%;
        }

        .file-card h3 {
            font-size: 17px;
            font-weight: 600;
            margin-bottom: 6px;
            color: #d0d0d0;
            font-family: 'Poppins', sans-serif;
            letter-spacing: 0.3px;
        }

        .file-card p {
            color: #808080;
            font-size: 12px;
            margin-bottom: 14px;
            font-family: 'Segoe UI', system-ui;
            line-height: 1.3;
        }

        .download-link {
            display: inline-block;
            background: rgba(150, 150, 150, 0.12);
            border: 1.5px solid rgba(180, 180, 180, 0.35);
            color: #c0c0c0;
            padding: 7px 22px;
            border-radius: 24px;
            text-decoration: none;
            font-weight: 500;
            font-size: 0.8rem;
            transition: background 0.2s, border-color 0.2s, color 0.2s, transform 0.2s;
            font-family: 'Poppins', sans-serif;
            letter-spacing: 0.3px;
            cursor: pointer;
            will-change: transform;
        }

        .download-link:active {
            transform: scale(0.95);
        }

        .download-link:hover {
            background: rgba(180, 180, 180, 0.2);
            border-color: rgba(200, 200, 200, 0.6);
            color: #ffffff;
            box-shadow: 0 0 15px rgba(200, 200, 200, 0.2);
        }

        .telegram-fab {
            position: fixed;
            bottom: 28px;
            right: 28px;
            width: 52px;
            height: 52px;
            border-radius: 50%;
            background: rgba(20, 20, 20, 0.8);
            border: 1.5px solid rgba(180, 180, 180, 0.4);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: transform 0.2s, border-color 0.2s, background 0.2s, box-shadow 0.2s;
            z-index: 999;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
            will-change: transform;
            -webkit-tap-highlight-color: transparent;
        }

        .telegram-fab svg {
            width: 26px;
            height: 26px;
            fill: #cccccc;
            pointer-events: none;
        }

        .telegram-fab:active {
            transform: scale(0.9);
        }

        .telegram-fab:hover {
            border-color: #cccccc;
            background: rgba(200, 200, 200, 0.2);
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.7), 0 0 25px rgba(200, 200, 200, 0.25);
        }

        .footer {
            margin-top: 40px;
            text-align: center;
            font-size: 0.7rem;
            color: #606060;
            border-top: 1px solid rgba(180, 180, 180, 0.08);
            padding-top: 20px;
            letter-spacing: 0.5px;
            font-family: 'Segoe UI', system-ui;
        }

        .empty-state {
            display: none;
            text-align: center;
            padding: 40px;
            color: #606060;
            font-size: 0.95rem;
        }

        @media (max-width: 750px) {
            body { padding: 16px; }
            .glass-panel { padding: 24px 16px; }
            .tab { padding: 8px 20px; font-size: 0.9rem; }
            .file-card { padding: 14px 12px; }
            .grid { grid-template-columns: repeat(auto-fill, minmax(140px, 160px)); gap: 12px; }
            .telegram-fab { width: 44px; height: 44px; bottom: 20px; right: 20px; }
            .telegram-fab svg { width: 22px; height: 22px; }
        }
    </style>
</head>
<body>

<div class="glass-panel">
    <div class="title">
        <span class="glow-text">FlowTrack</span>
    </div>

    <div class="tabs">
        <div class="tab active" data-tab="games">Игры</div>
        <div class="tab" data-tab="software">Программы</div>
    </div>

    <div id="gamesContainer" class="content-pane active">
        <div class="empty-state">Пусто</div>
        <div class="grid" id="gamesGrid"></div>
    </div>

    <div id="softwareContainer" class="content-pane">
        <div class="empty-state">Тут пока что пусто</div>
        <div class="grid" id="softwareGrid"></div>
    </div>

    <div class="footer">
        FlowTrack — Платформа установки игр и програм
    </div>
</div>

<a href="https://t.me/brawlstarsTutorial1" target="_blank" rel="noopener noreferrer" class="telegram-fab" title="Наш Telegram канал">
    <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
        <path d="M12 0C5.373 0 0 5.373 0 12s5.373 12 12 12 12-5.373 12-12S18.627 0 12 0zm5.562 8.161c-.18 1.897-.962 6.502-1.359 8.627-.168.9-.5 1.201-.82 1.23-.697.064-1.226-.46-1.901-.903-1.056-.692-1.653-1.123-2.678-1.8-1.185-.78-.417-1.21.258-1.91.177-.184 3.247-2.977 3.307-3.23.007-.032.014-.15-.056-.212s-.174-.041-.249-.024c-.106.024-1.793 1.14-5.061 3.345-.48.33-.913.49-1.302.48-.428-.01-1.252-.242-1.865-.44-.752-.245-1.349-.374-1.297-.79.027-.216.325-.437.893-.663 3.498-1.524 5.83-2.529 6.998-3.014 3.332-1.386 4.025-1.627 4.476-1.635.1-.002.32.023.463.14.12.1.153.235.17.33.015.095.035.31.02.48z"/>
    </svg>
</a>

<script>
    (function() {
        const tabs = document.querySelectorAll('.tab');
        const panes = {
            games: document.getElementById('gamesContainer'),
            software: document.getElementById('softwareContainer')
        };

        function activateTab(tabId) {
            Object.values(panes).forEach(pane => pane.classList.remove('active'));
            if (panes[tabId]) panes[tabId].classList.add('active');

            tabs.forEach(tab => {
                if (tab.getAttribute('data-tab') === tabId) {
                    tab.classList.add('active');
                } else {
                    tab.classList.remove('active');
                }
            });
        }

        tabs.forEach(tab => {
            tab.addEventListener('click', function(e) {
                e.preventDefault();
                const tabId = this.getAttribute('data-tab');
                if (tabId) activateTab(tabId);
            });
        });

        const gamesGrid = document.getElementById('gamesGrid');
        const softwareGrid = document.getElementById('softwareGrid');

        function showEmptyIfNeeded() {
            const gamesEmpty = document.querySelector('#gamesContainer .empty-state');
            const softwareEmpty = document.querySelector('#softwareContainer .empty-state');
            
            if (gamesGrid.children.length === 0 && gamesEmpty) gamesEmpty.style.display = 'block';
            else if (gamesEmpty) gamesEmpty.style.display = 'none';
            
            if (softwareGrid.children.length === 0 && softwareEmpty) softwareEmpty.style.display = 'block';
            else if (softwareEmpty) softwareEmpty.style.display = 'none';
        }

        window.addCard = function(section, title, description, downloadUrl) {
            const card = document.createElement('div');
            card.className = 'file-card';
            card.innerHTML = `
                <h3>${escapeHtml(title)}</h3>
                <p>${escapeHtml(description)}</p>
                <a href="${downloadUrl}" class="download-link" download="${downloadUrl.split('/').pop()}" target="_blank" rel="noopener noreferrer">Скачать</a>
            `;
            
            if (section === 'games') {
                gamesGrid.appendChild(card);
            } else if (section === 'software') {
                softwareGrid.appendChild(card);
            }
            showEmptyIfNeeded();
        };

        function escapeHtml(str) {
            return str.replace(/[&<>]/g, function(m) {
                if (m === '&') return '&amp;';
                if (m === '<') return '&lt;';
                if (m === '>') return '&gt;';
                return m;
            });
        }
        
    addCard('games', 'SpotyBank', 'Игровой банк', 'SpotyBank.apk');
    addCard('software', 'Нейроник', 'Нейросеть', 'Нейроник.apk');        
    addCard('games', 'WinStorm', 'Казино', 'WinStorm.apk');  
     showEmptyIfNeeded();
    })();
</script>

</body>
</html>
