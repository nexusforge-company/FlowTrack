<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>FlowTrack</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            background: #02010a;
            font-family: 'Poppins', 'Segoe UI', system-ui, -apple-system, sans-serif;
            padding: 24px;
            color: #ededed;
            display: flex;
            flex-direction: column;
            position: relative;
            overflow-x: hidden;
        }

        body::before {
            content: "";
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: 
                radial-gradient(1px 1px at 10% 20%, rgba(255,255,255,0.8), transparent),
                radial-gradient(1px 1px at 25% 55%, rgba(255,255,255,0.6), transparent),
                radial-gradient(1.5px 1.5px at 40% 10%, rgba(255,255,255,0.9), transparent),
                radial-gradient(1px 1px at 55% 70%, rgba(255,255,255,0.7), transparent),
                radial-gradient(1.5px 1.5px at 70% 30%, rgba(255,255,255,0.85), transparent),
                radial-gradient(1px 1px at 85% 60%, rgba(255,255,255,0.6), transparent),
                radial-gradient(1px 1px at 15% 80%, rgba(255,255,255,0.75), transparent),
                radial-gradient(1.5px 1.5px at 60% 90%, rgba(255,255,255,0.65), transparent),
                radial-gradient(1px 1px at 90% 15%, rgba(255,255,255,0.55), transparent),
                radial-gradient(1px 1px at 35% 40%, rgba(255,255,255,0.5), transparent),
                radial-gradient(1px 1px at 75% 50%, rgba(255,255,255,0.8), transparent),
                radial-gradient(1.2px 1.2px at 50% 50%, rgba(255,255,255,0.7), transparent),
                radial-gradient(1px 1px at 20% 65%, rgba(255,255,255,0.6), transparent),
                radial-gradient(1.3px 1.3px at 80% 85%, rgba(255,255,255,0.75), transparent),
                radial-gradient(1px 1px at 45% 25%, rgba(255,255,255,0.65), transparent);
            background-size: 300px 300px;
            pointer-events: none;
            z-index: 0;
            animation: twinkle 3s infinite alternate ease-in-out;
        }

        @keyframes twinkle {
            0% { opacity: 0.5; }
            50% { opacity: 1; }
            100% { opacity: 0.6; }
        }

        .glass-panel {
            max-width: 1100px;
            margin: 0 auto;
            background: transparent;
            backdrop-filter: none;
            border-radius: 56px;
            border: none;
            padding: 40px 32px;
            flex: 1;
            display: flex;
            flex-direction: column;
            position: relative;
            z-index: 1;
        }

        .title {
            text-align: center;
            margin-bottom: 40px;
        }

        .glow-text {
            font-size: clamp(42px, 9vw, 90px);
            font-weight: 700;
            letter-spacing: -0.02em;
            background: linear-gradient(135deg, #a0f0ff 0%, #c084fc 40%, #67e8f9 70%, #a78bfa 100%);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
            display: inline-block;
            animation: neonGlow 3s infinite alternate ease-in-out;
            will-change: filter;
            font-family: 'Poppins', 'Segoe UI', sans-serif;
            filter: drop-shadow(0 0 20px rgba(139, 92, 246, 0.5));
        }

        @keyframes neonGlow {
            0% {
                filter: drop-shadow(0 0 15px rgba(100, 200, 255, 0.4)) drop-shadow(0 0 30px rgba(139, 92, 246, 0.3));
            }
            50% {
                filter: drop-shadow(0 0 25px rgba(100, 200, 255, 0.6)) drop-shadow(0 0 40px rgba(139, 92, 246, 0.5));
            }
            100% {
                filter: drop-shadow(0 0 18px rgba(100, 200, 255, 0.5)) drop-shadow(0 0 35px rgba(139, 92, 246, 0.4));
            }
        }

        .tabs {
            display: flex;
            justify-content: center;
            gap: 16px;
            margin-bottom: 40px;
            flex-wrap: wrap;
        }

        .tab {
            background: rgba(20, 20, 40, 0.5);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1.5px solid rgba(139, 92, 246, 0.3);
            color: #c0c0d0;
            font-size: 1rem;
            font-weight: 500;
            padding: 10px 30px;
            border-radius: 60px;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            letter-spacing: 1px;
            font-family: 'Poppins', sans-serif;
            position: relative;
            overflow: hidden;
        }

        .tab::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(139, 92, 246, 0.2), transparent);
            transition: left 0.5s;
        }

        .tab:hover::before {
            left: 100%;
        }

        .tab.active {
            border-color: #a78bfa;
            background: rgba(139, 92, 246, 0.15);
            color: #ffffff;
            box-shadow: 0 0 25px rgba(139, 92, 246, 0.4), 0 0 50px rgba(6, 182, 212, 0.2);
        }

        .tab:hover {
            border-color: rgba(139, 92, 246, 0.7);
            background: rgba(139, 92, 246, 0.1);
            box-shadow: 0 0 20px rgba(139, 92, 246, 0.3);
            transform: translateY(-2px);
        }

        .content-pane {
            display: none;
            animation: fadeSlideUp 0.5s cubic-bezier(0.4, 0, 0.2, 1);
            flex: 1;
        }

        .content-pane.active {
            display: flex;
            flex-direction: column;
            flex: 1;
        }

        @keyframes fadeSlideUp {
            from { 
                opacity: 0; 
                transform: translateY(10px);
                filter: blur(3px);
            }
            to { 
                opacity: 1; 
                transform: translateY(0);
                filter: blur(0);
            }
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(160px, 180px));
            gap: 16px;
            flex: 1;
            justify-content: center;
        }

        .file-card {
            background: rgba(15, 15, 30, 0.6);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 16px;
            padding: 16px 14px;
            text-align: center;
            border: 1.5px solid rgba(139, 92, 246, 0.2);
            position: relative;
            overflow: hidden;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            width: 100%;
            cursor: default;
        }

        .file-card h3 {
            font-size: 17px;
            font-weight: 600;
            margin-bottom: 6px;
            color: #e8e8ff;
            font-family: 'Poppins', sans-serif;
            letter-spacing: 0.3px;
            text-shadow: 0 0 10px rgba(139, 92, 246, 0.2);
        }

        .file-card p {
            color: #9090b0;
            font-size: 12px;
            margin-bottom: 14px;
            font-family: 'Segoe UI', system-ui;
            line-height: 1.3;
        }

        .download-link {
            display: inline-block;
            background: rgba(139, 92, 246, 0.12);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1.5px solid rgba(139, 92, 246, 0.35);
            color: #c4b5fd;
            padding: 7px 22px;
            border-radius: 24px;
            text-decoration: none;
            font-weight: 500;
            font-size: 0.8rem;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            font-family: 'Poppins', sans-serif;
            letter-spacing: 0.3px;
            cursor: pointer;
        }

        .download-link:hover {
            background: rgba(139, 92, 246, 0.22);
            border-color: rgba(139, 92, 246, 0.65);
            color: #ffffff;
            box-shadow: 0 0 20px rgba(139, 92, 246, 0.35);
            transform: translateY(-2px);
        }

        /* Иконка Telegram */
        .telegram-fab {
            position: fixed;
            bottom: 28px;
            right: 28px;
            width: 52px;
            height: 52px;
            border-radius: 50%;
            background: rgba(20, 20, 40, 0.6);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1.5px solid rgba(139, 92, 246, 0.4);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 999;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5), 0 0 15px rgba(139, 92, 246, 0.2);
            animation: float 3s infinite ease-in-out;
        }

        .telegram-fab svg {
            width: 26px;
            height: 26px;
            fill: #ffffff;
            transition: transform 0.3s;
        }

        .telegram-fab:hover {
            border-color: #a78bfa;
            background: rgba(139, 92, 246, 0.2);
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.7), 0 0 30px rgba(139, 92, 246, 0.5);
            transform: scale(1.1);
        }

        .telegram-fab:hover svg {
            transform: rotate(-10deg) scale(1.1);
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-6px); }
        }

        .footer {
            margin-top: 40px;
            text-align: center;
            font-size: 0.7rem;
            color: #5a5a7a;
            border-top: 1px solid rgba(139, 92, 246, 0.1);
            padding-top: 20px;
            letter-spacing: 0.5px;
            font-family: 'Segoe UI', system-ui;
        }

        .empty-state {
            display: none;
            text-align: center;
            padding: 40px;
            color: #5a5a7a;
            font-size: 0.95rem;
        }

        @media (max-width: 750px) {
            body { padding: 16px; }
            .glass-panel { padding: 24px 16px; }
            .tab { padding: 8px 20px; font-size: 0.9rem; }
            .file-card { padding: 14px 12px; }
            .grid { grid-template-columns: repeat(auto-fill, minmax(140px, 160px)); gap: 12px; }
            .telegram-fab { width: 44px; height: 44px; bottom: 20px; right: 20px; }
            .telegram-fab svg { width: 22px; height: 22px; }
        }
    </style>
</head>
<body>

<div class="glass-panel">
    <div class="title">
        <span class="glow-text">FlowTrack</span>
    </div>

    <div class="tabs">
        <div class="tab active" data-tab="games">Игры</div>
        <div class="tab" data-tab="software">Программы</div>
    </div>

    <div id="gamesContainer" class="content-pane active">
        <div class="empty-state">Пусто</div>
        <div class="grid" id="gamesGrid"></div>
    </div>

    <div id="softwareContainer" class="content-pane">
        <div class="empty-state">Тут пока что пусто</div>
        <div class="grid" id="softwareGrid"></div>
    </div>

    <div class="footer">
        FlowTrack — Платформа установки игр и програм
    </div>
</div>

<!-- Кнопка Telegram с SVG иконкой -->
<a href="https://t.me/brawlstarsTutorial1" target="_blank" rel="noopener noreferrer" class="telegram-fab" title="Наш Telegram канал">
    <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
        <path d="M12 0C5.373 0 0 5.373 0 12s5.373 12 12 12 12-5.373 12-12S18.627 0 12 0zm5.562 8.161c-.18 1.897-.962 6.502-1.359 8.627-.168.9-.5 1.201-.82 1.23-.697.064-1.226-.46-1.901-.903-1.056-.692-1.653-1.123-2.678-1.8-1.185-.78-.417-1.21.258-1.91.177-.184 3.247-2.977 3.307-3.23.007-.032.014-.15-.056-.212s-.174-.041-.249-.024c-.106.024-1.793 1.14-5.061 3.345-.48.33-.913.49-1.302.48-.428-.01-1.252-.242-1.865-.44-.752-.245-1.349-.374-1.297-.79.027-.216.325-.437.893-.663 3.498-1.524 5.83-2.529 6.998-3.014 3.332-1.386 4.025-1.627 4.476-1.635.1-.002.32.023.463.14.12.1.153.235.17.33.015.095.035.31.02.48z"/>
    </svg>
</a>

<script>
    (function() {
        const tabs = document.querySelectorAll('.tab');
        const panes = {
            games: document.getElementById('gamesContainer'),
            software: document.getElementById('softwareContainer')
        };

        function activateTab(tabId) {
            Object.values(panes).forEach(pane => pane.classList.remove('active'));
            if (panes[tabId]) panes[tabId].classList.add('active');

            tabs.forEach(tab => {
                if (tab.getAttribute('data-tab') === tabId) {
                    tab.classList.add('active');
                } else {
                    tab.classList.remove('active');
                }
            });
        }

        tabs.forEach(tab => {
            tab.addEventListener('click', () => {
                const tabId = tab.getAttribute('data-tab');
                if (tabId) activateTab(tabId);
            });
        });

        const gamesGrid = document.getElementById('gamesGrid');
        const softwareGrid = document.getElementById('softwareGrid');

        function showEmptyIfNeeded() {
            const gamesEmpty = document.querySelector('#gamesContainer .empty-state');
            const softwareEmpty = document.querySelector('#softwareContainer .empty-state');
            
            if (gamesGrid.children.length === 0 && gamesEmpty) gamesEmpty.style.display = 'block';
            else if (gamesEmpty) gamesEmpty.style.display = 'none';
            
            if (softwareGrid.children.length === 0 && softwareEmpty) softwareEmpty.style.display = 'block';
            else if (softwareEmpty) softwareEmpty.style.display = 'none';
        }

        window.addCard = function(section, title, description, downloadUrl) {
            const card = document.createElement('div');
            card.className = 'file-card';
            card.innerHTML = `
                <h3>${escapeHtml(title)}</h3>
                <p>${escapeHtml(description)}</p>
                <a href="${downloadUrl}" class="download-link" download="${downloadUrl.split('/').pop()}" target="_blank" rel="noopener noreferrer">Скачать</a>
            `;
            
            if (section === 'games') {
                gamesGrid.appendChild(card);
            } else if (section === 'software') {
                softwareGrid.appendChild(card);
            }
            showEmptyIfNeeded();
        };

        function escapeHtml(str) {
            return str.replace(/[&<>]/g, function(m) {
                if (m === '&') return '&amp;';
                if (m === '<') return '&lt;';
                if (m === '>') return '&gt;';
                return m;
            });
        }
        
    addCard('games', 'SpotyBank', 'Игровой банк', 'SpotyBank.apk');
    addCard('software', 'Нейроник', 'Нейросеть', 'Нейроник.apk');        
    addCard('games', 'WinStorm', 'Казино', 'WinStorm.apk');  
     showEmptyIfNeeded();
    })();
</script>

</body>
</html>
